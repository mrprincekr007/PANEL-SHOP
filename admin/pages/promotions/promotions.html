<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#030305">
    <title>Nexus Admin | Promotions</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../../assets/styles/base.css">
    <link rel="stylesheet" href="promotions.css">
    <script src="../../assets/scripts/security.js"></script>
</head>
<body>
    <div class="dash-bg-engine"><div class="dash-grid"></div><div class="dash-glow top-left"></div><div class="dash-glow bottom-right"></div></div>
    <div id="sidebarContainer"></div>
    <main class="main-content-wrapper">
        <header class="dash-header glass-header">
            <div class="header-left"><button id="mobileMenuBtn" class="mobile-menu-toggle" type="button" aria-label="Open sidebar"><i class="fas fa-bars-staggered"></i></button><div class="page-title-box"><h1 id="page-title" class="cyber-title">Promotions</h1><div class="title-underline"></div></div></div>
            <div class="header-right"><div class="live-status"><span class="pulse-dot"></span> <span class="status-text">SYSTEM ONLINE</span></div><button id="sidebarThemeToggle" class="sidebar-theme-toggle" type="button" aria-label="Toggle theme"><i class="fas fa-moon"></i></button><div class="admin-profile-chip"><div class="admin-avatar"><i class="fas fa-user-shield"></i></div><span id="headerAdminEmail" class="admin-email">ADMIN</span></div></div>
        </header>
        <div class="sections-container custom-scrollbar">
            <section class="page-section active-section">
                <div class="promotions-grid">
                    <div class="form-card">
                        <h3><i class="fas fa-plus-circle" style="margin-right:8px;color:#bc13fe;"></i> Add Promotion</h3>
                        <div class="form-group"><label for="promoTitle">Title</label><input class="form-input" id="promoTitle" type="text" placeholder="Promotion title"></div>
                        <div class="form-group"><label for="promoDesc">Description</label><input class="form-input" id="promoDesc" type="text" placeholder="Short description"></div>
                        <div class="form-group"><label for="promoDiscount">Discount (%)</label><input class="form-input" id="promoDiscount" type="number" min="0" max="100" placeholder="e.g. 20"></div>
                        <div class="form-group"><label for="promoImg">Image URL</label><input class="form-input" id="promoImg" type="url" placeholder="https://..."></div>
                        <div class="form-group"><label for="promoLink">Destination Link</label><input class="form-input" id="promoLink" type="url" placeholder="https://..."></div>
                        <button class="btn-primary" id="btnAddPromo" type="button"><i class="fas fa-plus"></i> Add Promotion</button>
                    </div>
                    <div class="dash-box glass-panel">
                        <div class="box-header"><h2><i class="fas fa-bullhorn" style="color:#00f0ff;margin-right:8px;"></i> Managed Promotions</h2><button class="qa-btn" type="button" style="padding:8px 16px;font-size:11px;" onclick="location.reload()"><i class="fas fa-sync-alt"></i></button></div>
                        <div id="promotionsList" class="promotions-list"><div style="color:#888;font-size:13px;text-align:center;padding:20px;">Loading...</div></div>
                    </div>
                </div>
            </section>
        </div>
    </main>

    <div id="editPromoModal" class="modal-overlay hidden">
        <div class="modal-box">
            <div class="modal-header"><h3><i class="fas fa-edit" style="margin-right:8px;color:#bc13fe;"></i> Edit Promotion</h3><button class="modal-close-btn" type="button" onclick="closeEditPromo()"><i class="fas fa-times"></i></button></div>
            <input id="editPromoId" type="hidden">
            <div class="form-group"><label for="editPromoTitle">Title</label><input class="form-input" id="editPromoTitle" type="text"></div>
            <div class="form-group"><label for="editPromoDesc">Description</label><input class="form-input" id="editPromoDesc" type="text"></div>
            <div class="form-group"><label for="editPromoDiscount">Discount (%)</label><input class="form-input" id="editPromoDiscount" type="number" min="0" max="100"></div>
            <div class="form-group"><label for="editPromoImg">Image URL</label><input class="form-input" id="editPromoImg" type="url"></div>
            <div class="form-group"><label for="editPromoLink">Destination Link</label><input class="form-input" id="editPromoLink" type="url"></div>
            <button class="btn-primary" id="btnSaveEditPromo" type="button"><i class="fas fa-save"></i> Save Changes</button>
        </div>
    </div>

    <div id="promoToastContainer"></div>
    <div id="promoLoader" class="loader-overlay hidden"><div class="spinner"></div></div>

    <script type="module" src="promotions.js"></script>
    <script type="module">
        import { loadSidebar } from '../../assets/scripts/sidebar-loader.js';
        document.addEventListener('DOMContentLoaded', () => loadSidebar());
    </script>
    <script>if('serviceWorker' in navigator) navigator.serviceWorker.register('../../sw.js').catch(()=>{});</script>
</body>
</html>
