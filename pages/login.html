<!DOCTYPE html>
<html lang="en">
<head>
<!-- === BASIC SETUP === -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#09090d">
<title>NEXUS CORE</title>

<!-- === FONTS & ICONS === -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

<!-- === MASTER APPLICATION SCRIPT (pehle load hota hai) === -->
<link rel="stylesheet" href="../css/style.css">
    <!-- HIGH-SPEED SPECULATIVE PRERENDER (0ms Instant Page Switch) -->
    <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link rel="dns-prefetch" href="https://cdn.tailwindcss.com">
    <link rel="dns-prefetch" href="https://cdnjs.cloudflare.com">
    <link rel="dns-prefetch" href="https://www.gstatic.com">
    <script type="speculationrules">
    {
      "prerender": [
        {
          "source": "list",
          "urls": [
            "./home.html",
            "./shop.html",
            "./wallet.html",
            "./profile.html",
            "./helpdesk.html",
            "./my-keys.html",
            "./hwid-reset.html",
            "./payment-settings.html",
            "./referrals.html",
            "./user-settings.html"
          ],
          "eagerness": "immediate"
        }
      ]
    }
    </script>
</head>

<body class="auth-page">

<!-- ===== BACKGROUND EFFECTS ===== -->
<div id="particles"></div>
<div class="bg-grid"></div>
<div class="background-glow glow-left"></div>
<div class="background-glow glow-right"></div>

<!-- ===== LOGIN CARD ===== -->
<div class="login-container">
<div class="login-card">

<!-- LOGO -->
<div class="logo-box">
<div class="logo-circle"><i class="fa-solid fa-shield-halved"></i></div>
<h1>NEXUS CORE</h1>
<p>Premium Gaming Marketplace</p>
</div>

<!-- LOGIN / SIGNUP TABS -->
<div class="tab-container">
<button id="loginTab" class="tab active" type="button">LOGIN</button>
<button id="signupTab" class="tab" type="button">SIGN UP</button>
</div>

<!-- ===== LOGIN FORM ===== -->
<form id="loginForm" class="form active" autocomplete="on">
<div class="input-box">
<i class="fa-solid fa-envelope"></i>
<input type="text" id="loginEmail" placeholder="Email or Username" autocomplete="email" required>
</div>
<div class="input-box">
<i class="fa-solid fa-lock"></i>
<input type="password" id="loginPassword" placeholder="Enter Password" autocomplete="current-password" required>
<button type="button" id="loginEye" class="eye-btn"><i class="fa-solid fa-eye"></i></button>
</div>
<div class="option-row">
<label class="remember"><input type="checkbox" id="rememberMe"><span>Remember Me</span></label>
<button type="button" id="forgotPassword" class="forgot">Forgot Password?</button>
</div>
<button type="submit" id="loginBtn" class="main-btn"><i class="fa-solid fa-right-to-bracket"></i><span>LOGIN</span></button>
<div class="divider"><span>OR CONTINUE WITH</span></div>
<!-- GOOGLE LOGIN -->
<div class="social-row">
<button type="button" id="googleLogin" class="social google"><i class="fa-brands fa-google"></i><span>Continue with Google</span></button>
</div>
</form>

<!-- ===== SIGNUP FORM ===== -->
<form id="signupForm" class="form">
<div class="input-box">
<i class="fa-solid fa-user"></i>
<input type="text" id="signupName" placeholder="Full Name" required>
</div>
<div class="input-box">
<i class="fa-solid fa-at"></i>
<input type="text" id="signupUsername" placeholder="Username" autocomplete="off" required>
</div>
<div class="input-box">
<i class="fa-solid fa-envelope"></i>
<input type="email" id="signupEmail" placeholder="Email Address" required>
</div>
<div class="input-box">
<i class="fa-solid fa-lock"></i>
<input type="password" id="signupPassword" placeholder="Create Password" required>
<button type="button" id="signupEye" class="eye-btn"><i class="fa-solid fa-eye"></i></button>
</div>
<div class="input-box">
<i class="fa-solid fa-lock"></i>
<input type="password" id="signupConfirm" placeholder="Confirm Password" required>
<button type="button" id="confirmEye" class="eye-btn"><i class="fa-solid fa-eye"></i></button>
</div>
<div class="terms">
<label><input type="checkbox" id="agreeTerms" required><span>I agree to the Terms & Conditions</span></label>
</div>
<button type="submit" id="signupBtn" class="main-btn"><i class="fa-solid fa-user-plus"></i><span>CREATE ACCOUNT</span></button>
</form>

<!-- ===== LOADING SCREEN (Firebase process ke time) ===== -->
<div id="loadingScreen" class="loading-screen">
<div class="loader"></div>
<h2>Please Wait...</h2>
<p>Secure Authentication</p>
</div>

<!-- ===== TOAST CONTAINER (Success/Error messages yaha aayenge) ===== -->
<div id="toastBox"></div>

<!-- ===== GOOGLE SETUP MODAL (first-time Google user) ===== -->
<div class="modal-overlay hidden" id="googleSetupModal">
<div class="modal">
<div class="modal-header">
<h3><i class="fas fa-user-astronaut" style="color:#e11d48;"></i> Complete Setup</h3>
</div>
<div class="modal-body">
<p class="setup-sub">Choose your username and display name to continue.</p>
<div class="setup-field">
<label><i class="fas fa-user"></i> Display Name</label>
<input type="text" id="setupName" placeholder="Enter your name" maxlength="30">
</div>
<div class="setup-field">
<label><i class="fas fa-at"></i> Username</label>
<input type="text" id="setupUsername" placeholder="Choose a username" maxlength="20">
<span class="setup-hint">3-20 characters, letters, numbers, - and _</span>
</div>
<div id="setupError" class="setup-error hidden"></div>
</div>
<div class="modal-actions">
<button class="btn btn-primary" id="setupSubmitBtn"><i class="fas fa-rocket"></i> GET STARTED</button>
</div>
</div>
</div>

</div>
</div>

<!-- ================================================================
     JAVASCRIPT - Firebase Auth Engine
     ================================================================
     Yeh poora login/signup system handle karta hai:
       - Email/Password Login
       - Signup with validation
       - Google Login
       - Password Reset
       - Remember Me
       - Referral System
     ================================================================ -->
<!-- ===== SERVICE WORKER REGISTER ===== -->
    
    <script type="module" src="../js/login.js"></script>
</body>
</html>
